[package]
name = "clipforge"
version = "0.3.0"
edition = "2021"

[dependencies]
wry = "0.47"
tao = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rfd = "0.15"
regex = "1"
tiny_http = "0.12"
url = "2"
percent-encoding = "2"
rust-embed = "8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
